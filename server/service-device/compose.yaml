name: Honeycomb-device

services:
    database:
        image: mysql
        environment:
            MYSQL_ROOT_PASSWORD: 123456
            MYSQL_DATABASE: Honeycomb
        ports:
            - 3506:3306
            
    phpmyadmin:
        image: phpmyadmin
        ports: 
            - 8190:80
        environment:
            PMA_HOST: database